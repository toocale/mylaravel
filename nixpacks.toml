# Override the install phase to prevent post-install scripts from failing
# (package:discover tries to bootstrap Laravel which fails without .env)

[phases.install]
cmds = ["composer install --ignore-platform-reqs --no-scripts", "npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan package:discover --ansi && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
